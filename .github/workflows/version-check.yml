name: version-check

on:
  pull_request:
    branches: [main, next]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Check version files in lockstep
        run: |
          PLUGIN_VERSION=$(jq -r .version plugins/core/.claude-plugin/plugin.json)
          MARKETPLACE_VERSION=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          METADATA_VERSION=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          CODEX_VERSION=$(jq -r .version plugins/core/.codex-plugin/plugin.json)

          FAILED=0

          if [ "$PLUGIN_VERSION" != "$MARKETPLACE_VERSION" ]; then
            echo "::error::Version drift: plugin.json=$PLUGIN_VERSION vs marketplace.json plugins[0].version=$MARKETPLACE_VERSION"
            FAILED=1
          fi

          if [ "$PLUGIN_VERSION" != "$METADATA_VERSION" ]; then
            echo "::error::Version drift: plugin.json=$PLUGIN_VERSION vs marketplace.json metadata.version=$METADATA_VERSION"
            FAILED=1
          fi

          if [ "$PLUGIN_VERSION" != "$CODEX_VERSION" ]; then
            echo "::error::Version drift: plugins/core/.claude-plugin/plugin.json=$PLUGIN_VERSION vs plugins/core/.codex-plugin/plugin.json=$CODEX_VERSION"
            FAILED=1
          fi

          if [ "$FAILED" = "1" ]; then
            exit 1
          fi

          echo "Lockstep OK: all version fields at $PLUGIN_VERSION"

      - name: Check version bumped from base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Compare against the branch this PR actually targets. A next → next
          # PR is answerable only against next; measuring it against main asks
          # the wrong question and passes or fails for the wrong reason.
          if [ -z "$BASE_REF" ]; then
            echo "::error::no base branch on this event — cannot compare versions"
            exit 1
          fi
          PR_VERSION=$(jq -r .version plugins/core/.claude-plugin/plugin.json)
          git fetch origin "$BASE_REF"
          BASE_VERSION=$( (git show "origin/$BASE_REF:plugins/core/.claude-plugin/plugin.json" 2>/dev/null || git show "origin/$BASE_REF:.claude-plugin/plugin.json") | jq -r .version)

          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Version not bumped against $BASE_REF: still at $BASE_VERSION. Run /cut-release on the next branch to bump before opening this PR."
            exit 1
          fi

          echo "Version bumped against $BASE_REF: $BASE_VERSION → $PR_VERSION"

      - name: CHANGELOG has a section for the new version
        run: |
          PR_VERSION=$(jq -r .version plugins/core/.claude-plugin/plugin.json)
          if ! grep -qF "## [$PR_VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [$PR_VERSION]\" section. Move the [Unreleased] notes under a dated heading before merging."
            exit 1
          fi
          echo "CHANGELOG entry found for $PR_VERSION"
