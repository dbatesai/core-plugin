name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node syntax check on all scripts
        run: |
          set -e
          shopt -s globstar nullglob
          SCRIPTS=(plugins/core/skills/core/scripts/**/*.mjs)
          if [ ${#SCRIPTS[@]} -eq 0 ]; then echo "FAIL: script glob matched zero files — path moved?"; exit 1; fi
          fail=0
          for f in "${SCRIPTS[@]}"; do
            echo "checking $f"
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Validate plugin manifests are well-formed JSON
        run: |
          set -e
          for f in \
            plugins/core/.claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            plugins/core/.codex-plugin/plugin.json \
            .agents/plugins/marketplace.json \
            plugins/core/hooks/hooks.json; do
            echo "parsing $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

      - name: plugin.json has required fields
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("plugins/core/.claude-plugin/plugin.json","utf8"));
            for (const k of ["name","version","description","author","license"]) {
              if (!m[k]) { console.error("missing field: " + k); process.exit(1); }
            }
            console.log("plugin.json fields ok:", Object.keys(m).join(", "));
          '

      - name: Skill metadata present (version + build in plugin.json, SKILL.md)
        run: |
          set -e
          if [ ! -s plugins/core/skills/core/SKILL.md ]; then
            echo "missing or empty: plugins/core/skills/core/SKILL.md"
            exit 1
          fi
          # version + build are single-sourced in the Claude plugin manifest.
          node -e '
            const m = require("./plugins/core/.claude-plugin/plugin.json");
            for (const k of ["version", "build"]) {
              if (!m[k] || typeof m[k] !== "string") {
                console.error(`plugin.json missing or non-string "${k}"`); process.exit(1);
              }
            }
            if (!/^\d{8}\.\d+$/.test(m.build)) {
              console.error(`plugin.json build "${m.build}" is not YYYYMMDD.N`); process.exit(1);
            }
            console.log(`version=${m.version} build=${m.build}`);
          '

      - name: All harness manifests report same version
        run: |
          node -e '
            const fs = require("fs");
            const claude = JSON.parse(fs.readFileSync("plugins/core/.claude-plugin/plugin.json","utf8")).version;
            const codex  = JSON.parse(fs.readFileSync("plugins/core/.codex-plugin/plugin.json","utf8")).version;
            let failed = 0;
            if (claude !== codex) {
              console.error("Version drift: .claude-plugin=" + claude + " vs .codex-plugin=" + codex);
              failed = 1;
            }
            if (failed) process.exit(1);
            console.log("Harness manifest lockstep OK:", claude);
          '

      - name: Codex marketplace path integrity
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const market = JSON.parse(fs.readFileSync(".agents/plugins/marketplace.json","utf8"));
            const rootVersion = JSON.parse(fs.readFileSync("plugins/core/.codex-plugin/plugin.json","utf8")).version;
            let failed = 0;
            for (const p of market.plugins || []) {
              if (!p.source || p.source.source !== "local") continue;
              const pluginDir = path.resolve(p.source.path);
              if (!fs.existsSync(pluginDir)) {
                console.error("marketplace plugin dir missing: " + p.source.path + " (resolved: " + pluginDir + ")");
                failed = 1; continue;
              }
              const pluginJson = path.join(pluginDir, ".codex-plugin", "plugin.json");
              if (!fs.existsSync(pluginJson)) {
                console.error("missing " + pluginJson); failed = 1; continue;
              }
              const pj = JSON.parse(fs.readFileSync(pluginJson,"utf8"));
              if (pj.name !== p.name) {
                console.error("plugin name mismatch: marketplace=" + p.name + " vs plugin.json=" + pj.name);
                failed = 1;
              }
              if (pj.version !== rootVersion) {
                console.error("plugin version drift: root=" + rootVersion + " plugins/" + p.name + "=" + pj.version);
                failed = 1;
              }
              const skillsDir = path.join(pluginDir, "skills");
              if (!fs.existsSync(skillsDir)) {
                console.error("skills dir missing inside plugin dir: " + skillsDir); failed = 1;
              }
              console.log("plugin " + p.name + " at " + p.source.path + ": OK (v" + pj.version + ")");
            }
            if (failed) process.exit(1);
          '

      - name: SKILL.md has YAML frontmatter with name and description
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("plugins/core/skills/core/SKILL.md","utf8");
            const m = src.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!m) { console.error("no frontmatter block"); process.exit(1); }
            const fm = m[1];
            for (const k of ["name", "description"]) {
              if (!new RegExp("^" + k + ":\\s*\\S", "m").test(fm)) {
                console.error("frontmatter missing: " + k);
                process.exit(1);
              }
            }
            console.log("SKILL.md frontmatter ok");
          '

      - name: Scripts import without crashing
        run: |
          set -e
          shopt -s globstar nullglob
          SCRIPTS=(plugins/core/skills/core/scripts/*.mjs)
          if [ ${#SCRIPTS[@]} -eq 0 ]; then echo "FAIL: script glob matched zero files — path moved?"; exit 1; fi
          fail=0
          for f in "${SCRIPTS[@]}"; do
            echo "import-loading $f"
            node --input-type=module -e "await import('./$f');" || fail=1
          done
          exit $fail

      - name: Relative markdown links resolve
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = "plugins/core/skills/core";
            const docs = [];
            (function walk(dir) {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) walk(p);
                else if (e.isFile() && e.name.endsWith(".md")) docs.push(p);
              }
            })(root);
            const linkRe = /\]\((\.{1,2}\/[^)]+|[A-Za-z0-9_\-./]+\.(?:md|mjs|json|sh))\)/g;
            let broken = 0;
            for (const doc of docs) {
              const src = fs.readFileSync(doc, "utf8");
              const dir = path.dirname(doc);
              let m;
              while ((m = linkRe.exec(src))) {
                const raw = m[1].split("#")[0];
                if (!raw || raw.startsWith("http") || raw.startsWith("/")) continue;
                const target = path.resolve(dir, raw);
                if (!fs.existsSync(target)) {
                  console.error("broken link in " + doc + ": " + raw);
                  broken++;
                }
              }
            }
            if (broken) { console.error(broken + " broken link(s)"); process.exit(1); }
            console.log("checked " + docs.length + " markdown files, all links resolve");
          '
