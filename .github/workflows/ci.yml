name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node syntax check on all scripts
        run: |
          set -e
          shopt -s globstar nullglob
          SCRIPTS=(plugins/core/skills/core/scripts/**/*.mjs)
          if [ ${#SCRIPTS[@]} -eq 0 ]; then echo "FAIL: script glob matched zero files — path moved?"; exit 1; fi
          fail=0
          for f in "${SCRIPTS[@]}"; do
            echo "checking $f"
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Lint scripts (oxlint, scoped rules)
        run: npx --yes oxlint@1.69.0 -A all -D no-unused-vars -D no-useless-escape plugins/core/skills/core/scripts scripts/release tests/scripts .github/scripts

      - name: Validate plugin manifests are well-formed JSON
        run: |
          set -e
          for f in \
            plugins/core/.claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            plugins/core/.codex-plugin/plugin.json \
            .agents/plugins/marketplace.json \
            plugins/core/hooks/hooks.json; do
            echo "parsing $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

      - name: hooks.json entries conform to the hook schema
        run: |
          node -e '
            const fs = require("fs");
            // Both harness hook manifests: Claude Code's hooks/hooks.json AND
            // Codex hooks/hooks-codex.json — hardcoding a single file would
            // leave the other harness's manifest with zero CI schema coverage.
            const FILES = ["plugins/core/hooks/hooks.json", "plugins/core/hooks/hooks-codex.json"];
            const KNOWN = ["UserPromptSubmit","PreToolUse","PostToolUse","SessionStart","SessionEnd",
                           "PostCompact","PreCompact","Stop","SubagentStop","Notification"];
            let failed = 0;
            let totalEvents = 0;
            for (const file of FILES) {
              if (!fs.existsSync(file)) { console.error("missing hook manifest: " + file); failed = 1; continue; }
              const h = JSON.parse(fs.readFileSync(file, "utf8"));
              const hooks = (h && h.hooks) || {};
              totalEvents += Object.keys(hooks).length;
              for (const [event, entries] of Object.entries(hooks)) {
                if (!KNOWN.includes(event)) { console.error(file + ": unrecognized hook event: " + event); failed = 1; }
                if (!Array.isArray(entries)) { console.error(file + ": hook event " + event + " is not an array"); failed = 1; continue; }
                for (const entry of entries) {
                  const cmds = entry.hooks || [];
                  if (!Array.isArray(cmds) || cmds.length === 0 || cmds.some(c => c.type !== "command" || !c.command)) {
                    console.error(file + ": hook entry under " + event + " missing type:\"command\" + command"); failed = 1;
                  }
                }
              }
            }
            if (failed) process.exit(1);
            console.log("hooks.json + hooks-codex.json schema ok (" + totalEvents + " event(s) registered across " + FILES.length + " manifest(s))");
          '

      - name: plugin.json has required fields
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("plugins/core/.claude-plugin/plugin.json","utf8"));
            for (const k of ["name","version","description","author","license"]) {
              if (!m[k]) { console.error("missing field: " + k); process.exit(1); }
            }
            console.log("plugin.json fields ok:", Object.keys(m).join(", "));
          '

      - name: Skill metadata present (version + build in plugin.json, SKILL.md)
        run: |
          set -e
          if [ ! -s plugins/core/skills/core/SKILL.md ]; then
            echo "missing or empty: plugins/core/skills/core/SKILL.md"
            exit 1
          fi
          # version + build are single-sourced in the Claude plugin manifest.
          node -e '
            const m = require("./plugins/core/.claude-plugin/plugin.json");
            for (const k of ["version", "build"]) {
              if (!m[k] || typeof m[k] !== "string") {
                console.error(`plugin.json missing or non-string "${k}"`); process.exit(1);
              }
            }
            if (!/^\d{8}\.\d+$/.test(m.build)) {
              console.error(`plugin.json build "${m.build}" is not YYYYMMDD.N`); process.exit(1);
            }
            console.log(`version=${m.version} build=${m.build}`);
          '

      - name: All harness manifests report same version
        run: |
          node -e '
            const fs = require("fs");
            const claude = JSON.parse(fs.readFileSync("plugins/core/.claude-plugin/plugin.json","utf8")).version;
            const codex  = JSON.parse(fs.readFileSync("plugins/core/.codex-plugin/plugin.json","utf8")).version;
            let failed = 0;
            if (claude !== codex) {
              console.error("Version drift: .claude-plugin=" + claude + " vs .codex-plugin=" + codex);
              failed = 1;
            }
            if (failed) process.exit(1);
            console.log("Harness manifest lockstep OK:", claude);
          '

      - name: Codex marketplace path integrity
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const market = JSON.parse(fs.readFileSync(".agents/plugins/marketplace.json","utf8"));
            const rootVersion = JSON.parse(fs.readFileSync("plugins/core/.codex-plugin/plugin.json","utf8")).version;
            let failed = 0;
            for (const p of market.plugins || []) {
              if (!p.source || p.source.source !== "local") continue;
              const pluginDir = path.resolve(p.source.path);
              if (!fs.existsSync(pluginDir)) {
                console.error("marketplace plugin dir missing: " + p.source.path + " (resolved: " + pluginDir + ")");
                failed = 1; continue;
              }
              const pluginJson = path.join(pluginDir, ".codex-plugin", "plugin.json");
              if (!fs.existsSync(pluginJson)) {
                console.error("missing " + pluginJson); failed = 1; continue;
              }
              const pj = JSON.parse(fs.readFileSync(pluginJson,"utf8"));
              if (pj.name !== p.name) {
                console.error("plugin name mismatch: marketplace=" + p.name + " vs plugin.json=" + pj.name);
                failed = 1;
              }
              if (pj.version !== rootVersion) {
                console.error("plugin version drift: root=" + rootVersion + " plugins/" + p.name + "=" + pj.version);
                failed = 1;
              }
              const skillsDir = path.join(pluginDir, "skills");
              if (!fs.existsSync(skillsDir)) {
                console.error("skills dir missing inside plugin dir: " + skillsDir); failed = 1;
              }
              console.log("plugin " + p.name + " at " + p.source.path + ": OK (v" + pj.version + ")");
            }
            if (failed) process.exit(1);
          '

      - name: SKILL.md has YAML frontmatter with name and description
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("plugins/core/skills/core/SKILL.md","utf8");
            const m = src.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!m) { console.error("no frontmatter block"); process.exit(1); }
            const fm = m[1];
            for (const k of ["name", "description"]) {
              if (!new RegExp("^" + k + ":\\s*\\S", "m").test(fm)) {
                console.error("frontmatter missing: " + k);
                process.exit(1);
              }
            }
            console.log("SKILL.md frontmatter ok");
          '

      - name: Scripts import without crashing
        run: |
          set -e
          shopt -s globstar nullglob
          SCRIPTS=(plugins/core/skills/core/scripts/**/*.mjs)
          if [ ${#SCRIPTS[@]} -eq 0 ]; then echo "FAIL: script glob matched zero files — path moved?"; exit 1; fi
          fail=0
          for f in "${SCRIPTS[@]}"; do
            echo "import-loading $f"
            node --input-type=module -e "await import('./$f');" || fail=1
          done
          exit $fail

      - name: Relative markdown links resolve
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = "plugins/core/skills/core";
            const docs = [];
            (function walk(dir) {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) walk(p);
                else if (e.isFile() && e.name.endsWith(".md")) docs.push(p);
              }
            })(root);
            const linkRe = /\]\((\.{1,2}\/[^)]+|[A-Za-z0-9_\-./]+\.(?:md|mjs|json|sh))\)/g;
            let broken = 0;
            for (const doc of docs) {
              const src = fs.readFileSync(doc, "utf8");
              const dir = path.dirname(doc);
              let m;
              while ((m = linkRe.exec(src))) {
                const raw = m[1].split("#")[0];
                if (!raw || raw.startsWith("http") || raw.startsWith("/")) continue;
                const target = path.resolve(dir, raw);
                if (!fs.existsSync(target)) {
                  console.error("broken link in " + doc + ": " + raw);
                  broken++;
                }
              }
            }
            if (broken) { console.error(broken + " broken link(s)"); process.exit(1); }
            console.log("checked " + docs.length + " markdown files, all links resolve");
          '

      - name: Doc skill enumerations match shipped skills
        run: |
          node -e '
            const fs = require("fs");
            const shipped = new Set(fs.readdirSync("plugins/core/skills", { withFileTypes: true })
              .filter(d => d.isDirectory()).map(d => d.name));
            // Non-skill slash commands / hyphenated names the docs may legitimately mention.
            const allow = new Set(["plugin", "core-plugin", "cut-release"]);
            const docs = ["README.md", "INSTALL.md", "USAGE.md"].filter(f => fs.existsSync(f));
            let failed = 0;
            for (const doc of docs) {
              const src = fs.readFileSync(doc, "utf8");
              // 1. Backticked slash-command references: `/name`
              for (const m of src.matchAll(/`\/([a-z][a-z0-9-]*)`/g)) {
                const name = m[1];
                if (!shipped.has(name) && !allow.has(name)) {
                  console.error(doc + ": references `/" + name + "` but plugins/core/skills/" + name + "/ does not exist");
                  failed = 1;
                }
              }
              // 2. Backticked bare kebab-case names on lines that enumerate skills
              for (const line of src.split("\n")) {
                if (!/skills/i.test(line)) continue;
                for (const m of line.matchAll(/`([a-z][a-z0-9]*(?:-[a-z0-9]+)+)`/g)) {
                  const name = m[1];
                  if (!shipped.has(name) && !allow.has(name)) {
                    console.error(doc + ": skill enumeration names `" + name + "` but plugins/core/skills/" + name + "/ does not exist");
                    failed = 1;
                  }
                }
              }
            }
            // 3. Every shipped skill is documented in INSTALL.md
            const install = fs.readFileSync("INSTALL.md", "utf8");
            for (const name of shipped) {
              if (!install.includes(name)) {
                console.error("INSTALL.md does not mention shipped skill \"" + name + "\"");
                failed = 1;
              }
            }
            if (failed) process.exit(1);
            console.log("doc/skill cross-check OK (" + shipped.size + " skills, " + docs.length + " docs)");
          '

  test:
    name: test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The parent-SHA regression falsifier materializes a historical
          # release tree via git archive; a shallow clone cannot reach it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run node test suite
        shell: bash
        run: node --test tests/scripts/*.test.mjs

  source-package-smoke:
    name: source-package smoke (package built from committed source)
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the rollback leg resolves the immediate-prior
      # release tag and builds it (git archive <tag>:plugins/core).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Source-package smoke — committed artifact, packaged-path hooks, hostile env, rollback round-trip
        shell: bash
        run: bash tests/smoke/source-package-smoke.sh
